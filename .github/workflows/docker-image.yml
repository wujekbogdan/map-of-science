name: Docker image

on:
  workflow_call:
    inputs:
      app:
        description: "App directory name under src/apps"
        required: true
        type: string
      push:
        description: "Push the image to GHCR and tag it with the version"
        required: false
        type: boolean
        default: false
      version:
        description: "Image version tag, required when push is true"
        required: false
        type: string
      ref:
        description: "Git ref to build from, defaults to the triggering commit"
        required: false
        type: string

jobs:
  build:
    name: Build ${{ inputs.app }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/map-of-science-${{ inputs.app }}

      - name: Build (and push by digest when publishing)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/apps/${{ inputs.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ inputs.push && format('type=image,name=ghcr.io/{0}/map-of-science-{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, inputs.app) || '' }}
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export digest
        if: inputs.push
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and push manifest
    needs: build
    if: inputs.push
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/map-of-science-${{ inputs.app }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.app }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ inputs.version }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}"
