name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - uses: rharkor/caching-for-turbo@v2.3.13
      - run: pnpm i
      - run: pnpm turbo lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - uses: rharkor/caching-for-turbo@v2.3.13
      - run: pnpm i
      - run: pnpm turbo typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - uses: rharkor/caching-for-turbo@v2.3.13
      - run: pnpm i
      - run: pnpm turbo test:unit test:integration
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - uses: rharkor/caching-for-turbo@v2.3.13
      - run: pnpm i
      - run: pnpm turbo build

  docker-build:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        app: [web, api-server]
    uses: ./.github/workflows/docker-image.yml
    with:
      app: ${{ matrix.app }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, build]
    strategy:
      matrix:
        app: [web, api-server]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      app: ${{ matrix.app }}
      push: true
