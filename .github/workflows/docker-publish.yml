name: Publish Docker images

on:
  push:
    tags:
      - "@map-of-science/web@*"
      - "@map-of-science/api-server@*"

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve app and version from tag
        id: tag
        run: |
          ref="${{ github.ref_name }}"
          name="${ref%@*}"
          echo "app=${name##*/}" >> "$GITHUB_OUTPUT"
          echo "version=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/map-of-science-${{ steps.tag.outputs.app }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/apps/${{ steps.tag.outputs.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.app }}
          cache-to: type=gha,scope=${{ steps.tag.outputs.app }},mode=max
