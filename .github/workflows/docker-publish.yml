name: Publish Docker images

on:
  push:
    tags:
      - "@map-of-science/web@*"
      - "@map-of-science/api-server@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing package tag to re-release, e.g. @map-of-science/web@1.23.0"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    name: Resolve app and version from the tag
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Parse the package tag
        id: tag
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          package="${REF_NAME%@*}"
          echo "app=${package##*/}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME##*@}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: tag
    uses: ./.github/workflows/docker-image.yml
    with:
      app: ${{ needs.tag.outputs.app }}
      version: ${{ needs.tag.outputs.version }}
      ref: ${{ inputs.tag || github.ref_name }}
      push: true
