services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./src/apps/web/Dockerfile
    restart: always
    ports:
      - "8080:80"
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./src/apps/api-server/Dockerfile
    restart: always
    ports:
      - "3001:3001"
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
    name: map-of-science-qdrant-data